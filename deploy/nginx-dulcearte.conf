server {
    listen 80;
    server_name TU_IP_PUBLICA;

    client_max_body_size 10M;

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /home/ubuntu/dulcearte/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Archivos multimedia (fotos de recetas, comprobantes y evidencias)
    location /media/ {
        alias /home/ubuntu/dulcearte/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proxy inverso a Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
