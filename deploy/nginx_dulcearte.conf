server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name dulce-arte.duckdns.org 32.196.211.81 _;

    # Mitigación OWASP ZAP [10036]: Ocultar versión exacta de Nginx y SO
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dulce-arte.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dulce-arte.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Cabeceras de seguridad HTTP globales (DAST / OWASP)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /home/ubuntu/dulcearte/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Archivos multimedia (fotos de recetas, comprobantes y evidencias)
    location /media/ {
        alias /home/ubuntu/dulcearte/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Frontend Desacoplado servido en EC2 (Evaluación N°4)
    location /frontend/ {
        alias /home/ubuntu/dulcearte/frontend/;
        index index.html;
        try_files $uri $uri/ /frontend/index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Proxy inverso a Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
