# ==============================================================================
# NGINX DOCKER PROXY & RATE LIMITING (MITIGACIÓN DDOS / DOS)
# Asignatura: Desarrollo Backend | Seguridad y Arquitectura
# Autor: Rodrigo Alejandro Gallardo Martínez
# ==============================================================================

# Zona de limitación de tasa de peticiones (Rate Limiting)
# Limita a 15 peticiones por segundo por dirección IP
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;

# Zona de limitación de conexiones simultáneas por IP (Mitigación DoS)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name localhost dulce-arte.duckdns.org 32.196.211.81;

    client_max_body_size 15M;

    # Aplicar límite de conexiones simultáneas por IP
    limit_conn conn_limit 15;

    # Cabeceras de seguridad HTTP
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;

    # Compresión gzip para optimizar ancho de banda
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Servir archivos estáticos directamente desde el volumen compartido
    location /static/ {
        alias /var/www/dulcearte/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Servir archivos multimedia (fotos y firmas)
    location /media/ {
        alias /var/www/dulcearte/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proxy inverso hacia el contenedor Django con Rate Limiting activo
    location / {
        # Rate Limiting: ráfagas de hasta 25 peticiones antes de aplicar delay o bloqueo HTTP 429
        limit_req zone=api_rate_limit burst=25 delay=10;

        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
