# ==============================================================================
# DOCKER COMPOSE - ORQUESTACIÓN DULCE ARTE
# Componentes: Web (Django), DB (PostgreSQL 16), Proxy (Nginx con Rate Limit)
# Autor: Rodrigo Alejandro Gallardo Martínez
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Servicio 1: Base de Datos Relacional PostgreSQL 16
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dulcearte_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dulcearte_db
      POSTGRES_USER: dulcearte_user
      POSTGRES_PASSWORD: DulceArte2024!
      TZ: America/Santiago
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulcearte_user -d dulcearte_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dulcearte_net

  # ----------------------------------------------------------------------------
  # Servicio 2: Backend API & Web Application (Django 5 + Gunicorn)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dulcearte_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=False
      - SECRET_KEY=clave-secreta-de-desarrollo-local-dulcearte-2024-segura
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,dulce-arte.duckdns.org,32.196.211.81
      - CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1,http://32.196.211.81,https://32.196.211.81,http://dulce-arte.duckdns.org,https://dulce-arte.duckdns.org
      - DATABASE_URL=postgres://dulcearte_user:DulceArte2024!@db:5432/dulcearte_db
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    networks:
      - dulcearte_net

  # ----------------------------------------------------------------------------
  # Servicio 3: Proxy Inverso Nginx con Rate Limiting y Protección DDoS
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: dulcearte_proxy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/dulcearte/staticfiles:ro
      - media_volume:/var/www/dulcearte/media:ro
    networks:
      - dulcearte_net

volumes:
  postgres_data:
    name: dulcearte_postgres_data
  static_volume:
    name: dulcearte_static_volume
  media_volume:
    name: dulcearte_media_volume

networks:
  dulcearte_net:
    name: dulcearte_network
    driver: bridge
